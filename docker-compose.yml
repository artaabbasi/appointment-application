version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nginx/unit:1.26.1-python3.10
    container_name: backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file: .env
    volumes:
      - ./media:/fastapi/media
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=db
    ports:
      - "8000:8000"
    networks:
      - app-network
    logging:
      driver: local
      options:
        max-size: "100m"
        max-file: "3"


  db:
    image: postgres:14-alpine
    container_name: db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
    networks:
      - app-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - app-network

#  grafana:
#    image: grafana/grafana
#    container_name: grafana
#    ports:
#      - "3000:3000"
#    volumes:
#      - grafana-storage:/var/lib/grafana
#    networks:
#      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${DATABASE_USER}@email.com
      - PGADMIN_DEFAULT_PASSWORD=${DATABASE_PASSWORD}
    entrypoint: /bin/sh -c "chmod 600 /pgpass; /entrypoint.sh;"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
      - source: pgpass
        target: /pgpass

configs:
  pgpass:
    file: ./pgpass
  servers.json:
    file: ./servers.json

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "10.11.11.0/24"
          gateway: "10.11.11.1"
volumes:
  db:
    driver: local
  media:
    driver: local
#  grafana-storage:
#    driver: local
  pgadmin-data:
    driver: local